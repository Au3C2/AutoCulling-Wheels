name: build-wheels

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install build tools
        run: |
          pip install cmake ninja scikit-build wheel numpy
      - name: Build macOS wheel
        run: |
          chmod +x scripts/build_opencv_macos.sh
          ./scripts/build_opencv_macos.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos
          path: dist/*.whl

  release:
    needs: [build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create / Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v5.0.0.93-cull1' }}
          name: AutoCulling Prebuilt Wheels ${{ github.ref_name || 'v5.0.0.93-cull1' }}
          draft: false
          prerelease: false
          files: artifacts/**/*.whl

name: build-wheels

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - '.github/workflows/build-wheels.yml'
      - 'scripts/**'

jobs:
  build-macos:
    # macos-14 images were retired 2026-11-02 (runner-images#13518 brownout);
    # macos-15 is the arm64 successor.
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install build tools
        run: |
          pip install cmake ninja scikit-build wheel numpy "cython>=3.1,<3.2" "setuptools==79.0.1" delocate pkgconfig flatbuffers protobuf
      - name: Build minimal OpenCV wheel
        run: |
          chmod +x scripts/build_opencv_macos.sh
          ./scripts/build_opencv_macos.sh dist
      - name: Build minimal PyAV wheel
        run: |
          chmod +x scripts/build_av_macos.sh
          ./scripts/build_av_macos.sh dist
      - name: Build reduced-ops ONNX Runtime wheel
        timeout-minutes: 120
        run: |
          chmod +x scripts/build_ort_macos.sh
          ./scripts/build_ort_macos.sh dist
      - name: Generate sha256 checksums
        run: |
          cd dist && shasum -a 256 *.whl > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos
          path: dist/*

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install build tools
        shell: bash
        run: |
          pip install cmake ninja wheel numpy "cython>=3.1,<3.2" "setuptools==79.0.1"
      - name: Build pocketfft_fast wheel
        shell: bash
        run: |
          chmod +x scripts/build_pocketfft_windows.sh
          ./scripts/build_pocketfft_windows.sh dist
      - name: Build minimal OpenCV wheel
        shell: bash
        timeout-minutes: 120
        run: |
          chmod +x scripts/build_opencv_windows.sh
          ./scripts/build_opencv_windows.sh dist
      - name: Setup MSYS2 (mingw64 toolchain for the PyAV build)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          release: false
          path-type: inherit
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-make mingw-w64-x86_64-nasm make diffutils
        # The pyav wheel must be built with the MinGW toolchain (see
        # build_av_windows.sh header): the MSVC-built ffmpeg crashed in HEVC
        # decode. The extension itself is still compiled with the Windows
        # CPython (setup-python) using distutils' mingw32 compiler.
      - name: Build minimal PyAV wheel
        shell: msys2 {0}
        run: |
          export MINGW_BIN="$(cygpath -u /mingw64/bin)"
          export PATH="/mingw64/bin:$PATH"
          OUT_ABS=$(cygpath -m "$(cygpath -u "$GITHUB_WORKSPACE")/dist")
          bash scripts/build_av_windows.sh "$OUT_ABS"
      - name: Generate sha256 checksums
        shell: bash
        run: |
          cd dist && sha256sum *.whl > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows
          path: dist/*

  build-windows-ort:
    # The reduced-ops DirectML ORT build takes ~2-3 h on a 4-core runner;
    # split it into its own job so the rest of the windows wheels are not
    # serialized behind it.
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      # windows-latest ships only VS 18 (cl 14.51) — no VS 2022 side-by-side
      # (msvc-dev-cmd vsversion:17 resolves nothing). ORT 1.23.0 predates
      # VS 18: its legacy non-string [[gsl::suppress]] in capture.h raises
      # C4875 there, and /WX escalates it. The script passes /wd4875 via
      # CMAKE_CXX_FLAGS; escalate to /Wv:17 if further new-compiler warnings
      # surface.
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install build tools
        shell: bash
        run: |
          pip install wheel numpy "onnx>=1.17" "setuptools==79.0.1" flatbuffers protobuf
      - name: Build reduced-ops onnxruntime-directml wheel
        shell: bash
        timeout-minutes: 270
        run: |
          chmod +x scripts/build_onnxruntime_windows.sh
          ./scripts/build_onnxruntime_windows.sh "$(cygpath -m "$GITHUB_WORKSPACE/dist")"
      - name: Generate sha256 checksums
        shell: bash
        run: |
          cd dist && sha256sum *.whl > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-ort
          path: dist/*

  release:
    needs: [build-macos, build-windows, build-windows-ort]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create / Update Release
        uses: softprops/action-gh-release@v2
        with:
          # Branch pushes must target the fixed wheel release, not a release
          # named after the branch (github.ref_name would be 'main').
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v5.0.0.93-cull1' }}
          name: AutoCulling Prebuilt Wheels ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v5.0.0.93-cull1' }}
          draft: false
          prerelease: false
          files: artifacts/**/*.whl

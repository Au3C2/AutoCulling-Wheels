name: build-wheels

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - '.github/workflows/build-wheels.yml'
      - 'scripts/**'

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install build tools
        run: |
          pip install cmake ninja scikit-build wheel numpy
      - name: Build macOS wheel
        run: |
          chmod +x scripts/build_opencv_macos.sh
          ./scripts/build_opencv_macos.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos
          path: dist/*.whl

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install build tools
        shell: bash
        run: |
          pip install cmake ninja wheel numpy
      - name: Build pocketfft_fast wheel
        shell: bash
        run: |
          chmod +x scripts/build_pocketfft_windows.sh
          ./scripts/build_pocketfft_windows.sh dist
      - name: Build minimal OpenCV wheel
        shell: bash
        timeout-minutes: 120
        run: |
          chmod +x scripts/build_opencv_windows.sh
          ./scripts/build_opencv_windows.sh dist
      - name: Build minimal PyAV wheel
        shell: bash
        run: |
          chmod +x scripts/build_av_windows.sh
          ./scripts/build_av_windows.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows
          path: dist/*.whl

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create / Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v5.0.0.93-cull1' }}
          name: AutoCulling Prebuilt Wheels ${{ github.ref_name || 'v5.0.0.93-cull1' }}
          draft: false
          prerelease: false
          files: artifacts/**/*.whl
